<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition Attendance</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        input, button {
            margin: 10px;
            padding: 8px;
            font-size: 16px;
        }
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h1>Face Recognition Attendance System</h1>

    <!-- Take Attendance -->
    <h2>Take Attendance</h2>
    <label for="lecture">Lecture Name:</label>
    <input type="text" id="lecture" placeholder="Enter Lecture Name">
    <label for="periods">Total Periods:</label>
    <input type="number" id="periods" placeholder="Enter Total Periods">
    <button onclick="takeAttendance()">Start Attendance</button>
    <p id="attendanceStatus"></p>

    <!-- Capture Image -->
    <h2>Capture Image</h2>
    <label for="name">Person Name:</label>
    <input type="text" id="name" placeholder="Enter Name">
    <button onclick="captureImage()">Capture</button>
    <p id="captureStatus"></p>

    <!-- Get Attendance -->
    <h2>Attendance Percentage</h2>
    <button onclick="getAttendance()">Get My Attendance</button>
    <p id="attendanceResult"></p>

    <!-- Attendance Table -->
    <h2>Attendance Records</h2>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Date</th>
                <th>Day</th>
                <th>Time</th>
                <th>Total Periods</th>
                <th>Attended Periods</th>
                <th>Average Attendance</th>
            </tr>
        </thead>
        <tbody id="attendance-table-body">
            <!-- Attendance data will be inserted here dynamically -->
        </tbody>
    </table>

    <script>
        // Start Attendance
        function takeAttendance() {
            const lecture = document.getElementById("lecture").value;
            const periods = document.getElementById("periods").value;

            if (!lecture || !periods) {
                alert("Please enter both Lecture Name and Total Periods!");
                return;
            }

            fetch('/start_attendance', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({lecture, periods})
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
                document.getElementById("attendanceStatus").innerText = data.message;
            })
            .catch(error => console.error("Error:", error));
        }

        // Capture Image
        function captureImage() {
            const name = document.getElementById("name").value;

            if (!name) {
                alert("Please enter a name!");
                return;
            }

            fetch('/capture_image', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name})
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
                document.getElementById("captureStatus").innerText = data.message;
            })
            .catch(error => console.error("Error:", error));
        }

        // Get Attendance Percentage
        function getAttendance() {
            fetch('/get_attendance')
            .then(response => response.json())
            .then(data => {
                alert(data.message);
                document.getElementById("attendanceResult").innerText = data.output;
            })
            .catch(error => console.error("Error:", error));
        }

        // Fetch Attendance Records
        function fetchAttendanceRecords() {
            fetch("/get_attendance_records")
                .then(response => response.json())
                .then(data => {
                    let tableBody = document.getElementById("attendance-table-body");
                    tableBody.innerHTML = ""; // Clear previous data

                    data.forEach(row => {
                        let tr = document.createElement("tr");
                        tr.innerHTML = `
                            <td>${row.name}</td>
                            <td>${row.date}</td>
                            <td>${row.day}</td>
                            <td>${row.time}</td>
                            <td>${row.total_periods}</td>
                            <td>${row.attended_periods}</td>
                            <td>${row.average_attendance.toFixed(2)}%</td>
                        `;
                        tableBody.appendChild(tr);
                    });
                })
                .catch(error => console.error("Error fetching attendance records:", error));
        }

        // Auto-refresh attendance table every 5 seconds
        setInterval(fetchAttendanceRecords, 5000);
        window.onload = fetchAttendanceRecords;
    </script>

</body>
</html>
